<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -60 80 100">
  <style>
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Monitor screen background -->
  <rect x="-26" y="-30" width="52" height="34" rx="2" fill="#bae6fd" />
  
  <!-- Terminal Prompt Symbol > -->
  <path d="M -18 -20 L -12 -13 L -18 -6" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Terminal Cursor _ -->
  <line x1="-8" y1="-6" x2="0" y2="-6" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" class="cursor" />

  <!-- Monitor frame -->
  <rect x="-30" y="-34" width="60" height="42" rx="4" fill="none" stroke="currentColor" stroke-width="4" />
  
  <!-- Monitor stand neck -->
  <path d="M -8 8 L -12 22 L 12 22 L 8 8 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Monitor stand base -->
  <path d="M -20 22 L 20 22" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
</svg>
