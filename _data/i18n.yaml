    intro: 软件测试与分析研究室隶属中国科学院软件研究所，有包含国家杰青在内的强大教职工团队，在培学生和已培养学生数量过百人。研究室长期致力于程序分析、软件测试、约束求解等领域的基础与应用研究，理论创新与工具落地并重，研究成果大量发表于
      ICSE, FSE, ASE, ISSTA (软件工程顶会) 及 NeurIPS, AAAI , ICML(人工智能顶会) 等高水平会议和期刊上，承担多项国家级、省部级重大科研项目。现有职工
      9 人，其中研究员 2 人，副研究员 2 人，高级工程师 1 人，博后 2 人。
