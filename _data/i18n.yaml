  home:
    title: Welcome to Software Testing and Analysis Group
    intro: The Software Testing and Analysis Group is affiliated with the Institute
      of Software, Chinese Academy of Sciences. Our group features a strong faculty
      team, including National Distinguished Young Scholars, with over a hundred current
      and alumni students. We have long been dedicated to foundational and applied
      research in areas such as program analysis, software testing, automated reasoning,
      and constraint solving. Emphasizing both theoretical innovation and practical
      tool deployment, our research outcomes are widely published in top-tier Software
      Engineering conferences (ICSE, FSE, ASE, ISSTA) and AI conferences (NeurIPS,
      AAAI, ICML). We also undertake numerous major national scientific research projects.
      The lab currently has 9 staff members, including 2 researchers, 2 associate
      researchers, 1 senior engineer, and 2 postdoctoral researchers.
